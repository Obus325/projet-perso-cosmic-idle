<div class="contenu_onglets" id="contenu_equilibre" hidden>
    <button class="sous_onglet_button" id="bouton_sous_onglet_densite_densite" onclick="ChangerSousOnglet('sous_onglet_densite_base')"> équilibre </button>
    <button class="sous_onglet_button" id="bouton_sous_onglet_densite_progression" onclick="ChangerSousOnglet('sous_onglet_densite_echelle')" hidden> progression </button>
    <!--<button class="sous_onglet_button" id="onglet_statistiques" onclick="ChangerSousOnglet('sous_onglet_particules_p2')"> prestige 2 </button> non utilisé pour le moment-->

    <div class="sous_onglets" id="sous_onglet_densite_base" hidden>
        densité de l'univers : <span class="valeur" id="valeur_densité">0</span>
        <span class="text_progress"> </span>
        <div class="progress">
            <div class="progress_bar" id="pourcent_densite"></div>
        </div>


        <table class="equilibre table_ameliorations">
            <tr>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "ameliorer_taille"
                            onclick="
                            if(Achat(AugmenterPourcent, [1.1, variables.actuel.densite, 'taille'], ressources, 'equilibrium',  'densite', 'taille'))
                                {
                                    prix.actuel.densite.taille += prix.increment.densite.taille;
                                    AfficherVariableDensite('taille', variables.actuel.densite['taille'].toFixed(1).toString() + '%');
                                }
                            ">
                        Augmenter la taille de l'univers de 10% <br> Actuellement : <span id="valeur_taille">100 </span>
                        <br> Prix : <span id="prix_taille">10 </span>
                    </button>
                </td>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "ameliorer_diviseur"
                            onclick="
                            if(Achat(AugmenterPourcent, [0.95, variables.actuel.densite, 'diviseurMassique'], ressources, 'equilibrium',  'densite', 'diviseurMassique'))
                                {
                                    prix.actuel.densite.diviseurMassique += prix.increment.densite.diviseurMassique;
                                    AfficherVariableDensite('diviseurMassique', variables.actuel.densite['diviseurMassique'].toFixed(2).toString() + '%')
                                }
                            ">
                        Diminuer le réducteur de masse de 5 % <br> Actuellement : <span id="valeur_diviseurMassique">1 </span>
                        <br> Prix : <span id="prix_diviseurMassique">10 </span>
                    </button>
                </td>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "ameliorer_cap"
                            onclick="
                            if(Achat(Augmenter, [0.1, variables.actuel.densite, 'cap'], ressources, 'equilibrium',  'densite', 'cap'))
                                {
                                    prix.actuel.densite.cap += prix.increment.densite.cap;
                                    AfficherVariableDensite('cap', variables.actuel.densite['cap'].toFixed(1).toString())
                                }
                            ">
                        Augmenter le cap de densité de 0.1 <br> Actuellement : <span id="valeur_cap">1 </span>
                        <br> Prix : <span id="prix_cap">10 </span>
                    </button>
                </td>
            </tr>

            <tr>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "acheter_automate"
                            onclick="
                            if(Achat(Augmenter, [1, variables.actuel.densite, 'automate'], ressources, 'equilibrium',  'densite', 'automate'))
                            {
                                prix.actuel.densite.automate += prix.increment.densite.automate;
                                AfficherVariableDensite('automate', variables.actuel.densite['automate'].toString())
                            }"
                    >
                        acheter un automate <br> Actuellement : <span id="valeur_automate"> 0 </span>
                        <br> Prix : <span id="prix_automate">10 </span>
                </td>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "ameliorer_equilibrium"
                            onclick="
                            if(Achat(Augmenter, [0.05, variables.actuel.densite, 'boostEquilibrium'], ressources, 'equilibrium',  'densite', 'boostEquilibrium'))
                            {
                                prix.actuel.densite.boostEquilibrium += prix.increment.densite.boostEquilibrium;
                                AfficherVariableDensite('boostEquilibrium', 'x' + variables.actuel.densite['boostEquilibrium'].toFixed(2).toString())
                            }"
                    >
                        obtenir plus de particules de densité par seconde <br> Actuellement : <span id="valeur_boostEquilibrium">x1 </span>
                        <br> Prix : <span id="prix_boostEquilibrium">10 </span>

                    </button>
                </td>
                <td class="amelioration_equilibre">
                    <button class="buy_button amelioration" id = "ameliorer_dmax"
                            onclick="
                            if(Achat(AugmenterPourcent, [1.05, variables.actuel.densite, 'boostDMax'], ressources, 'equilibrium',  'densite', 'max'))
                                {
                                    prix.actuel.densite.max += prix.increment.densite.max;
                                    AfficherVariableDensite('max', 'x' + variables.actuel.densite['boostDMax'].toFixed(2).toString())
                                    ressources.densite_max *= 1.05;
                                }">

                        Obtenir un boost à la densité maximum de 5% <br> Actuellement : <span id="valeur_max">x1 </span>
                        <br> Prix : <span id="prix_max">10 </span>
                    </button>
                </td>
            </tr>


        </table>
